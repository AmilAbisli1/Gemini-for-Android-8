name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK 36.1 and licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || true
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found under $SDK_DIR"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
